<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Full-bleed background for maskable safe-zone compliance -->
    <linearGradient id="maskableTileGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="45%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>

    <!-- Top Gloss Highlight Reflection -->
    <linearGradient id="glossHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Geometric Lettermark L Gradient -->
    <linearGradient id="lettermarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="85%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>

    <linearGradient id="lettermarkDepth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="soundwaveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="soundwaveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.65" />
    </linearGradient>

    <linearGradient id="soundwaveGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#E879F9" stop-opacity="0.4" />
    </linearGradient>

    <filter id="elementGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#6366F1" flood-opacity="0.4" />
    </filter>

    <filter id="soundwaveGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full bleed background for Android maskable safe-zone -->
  <rect width="512" height="512" fill="url(#maskableTileGradient)" />

  <!-- Ambient Radial Light in Safe Zone -->
  <radialGradient id="innerLight" cx="40%" cy="35%" r="60%">
    <stop offset="0%" stop-color="#818CF8" stop-opacity="0.35" />
    <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
  </radialGradient>
  <rect width="512" height="512" fill="url(#innerLight)" />

  <!-- 3D Gloss Highlight -->
  <path d="M0 0 L512 0 L512 180 C360 220 180 200 0 160 Z" fill="url(#glossHighlight)" />

  <!-- Safe-zone scaled icon mark (scaled to fit within 80% circle) -->
  <g transform="translate(10, 5) scale(0.96)" filter="url(#elementGlow)">
    <!-- Acoustic Soundwaves -->
    <path d="M 285 240 A 65 65 0 0 1 285 360" fill="none" stroke="url(#soundwaveGrad1)" stroke-width="14" stroke-linecap="round" filter="url(#soundwaveGlow)" />
    <path d="M 330 205 A 115 115 0 0 1 330 395" fill="none" stroke="url(#soundwaveGrad2)" stroke-width="14" stroke-linecap="round" filter="url(#soundwaveGlow)" />
    <path d="M 375 170 A 165 165 0 0 1 375 430" fill="none" stroke="url(#soundwaveGrad3)" stroke-width="14" stroke-linecap="round" filter="url(#soundwaveGlow)" />

    <!-- Amplitude lines -->
    <line x1="285" y1="285" x2="285" y2="315" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" opacity="0.9" />
    <line x1="330" y1="270" x2="330" y2="330" stroke="#818CF8" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    <line x1="375" y1="260" x2="375" y2="340" stroke="#C084FC" stroke-width="6" stroke-linecap="round" opacity="0.7" />

    <!-- 3D Extruded Shadow for L -->
    <path d="M 134 146 L 182 146 L 182 334 L 278 334 L 278 382 L 134 382 Z" fill="url(#lettermarkDepth)" transform="translate(6, 8)" />

    <!-- Geometric Lettermark L -->
    <path d="M 134 140 C 134 133 139 128 146 128 L 174 128 C 181 128 186 133 186 140 L 186 324 L 266 324 C 273 324 278 329 278 336 L 278 364 C 278 371 273 376 266 376 L 146 376 C 139 376 134 371 134 364 Z" fill="url(#lettermarkGrad)" />
    <path d="M 136 138 L 172 138 M 136 140 L 136 362 M 138 326 L 264 326" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.65" />

    <!-- Core voice node -->
    <circle cx="160" cy="350" r="10" fill="#38BDF8" filter="url(#soundwaveGlow)" />
    <circle cx="160" cy="350" r="5" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>

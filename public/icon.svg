<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="tileGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>

    <!-- Top Gloss Highlight Reflection -->
    <linearGradient id="glossHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- 3D Bevel / Rim Gradient -->
    <linearGradient id="rimStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#4F46E5" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.8" />
    </linearGradient>

    <!-- Geometric Lettermark L Gradient -->
    <linearGradient id="lettermarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="85%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>

    <!-- Lettermark 3D Extrusion Shadow Gradient -->
    <linearGradient id="lettermarkDepth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.9" />
    </linearGradient>

    <!-- Soundwave Glow Gradient 1 -->
    <linearGradient id="soundwaveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.7" />
    </linearGradient>

    <!-- Soundwave Glow Gradient 2 -->
    <linearGradient id="soundwaveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.65" />
    </linearGradient>

    <!-- Soundwave Glow Gradient 3 -->
    <linearGradient id="soundwaveGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#E879F9" stop-opacity="0.4" />
    </linearGradient>

    <!-- Drop Shadows & Ambient Glow Filters -->
    <filter id="tileShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0F172A" flood-opacity="0.55" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#312E81" flood-opacity="0.4" />
    </filter>

    <filter id="elementGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#6366F1" flood-opacity="0.45" />
    </filter>

    <filter id="soundwaveGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Ambient Canvas (Transparent for clean cropping) -->
  <g id="app-icon-container">
    
    <!-- Outer Squircle with 3D Depth Shadow -->
    <rect 
      x="32" 
      y="32" 
      width="448" 
      height="448" 
      rx="104" 
      ry="104" 
      fill="url(#tileGradient)" 
      filter="url(#tileShadow)" 
    />

    <!-- Ambient Inner Glow Radial -->
    <radialGradient id="innerSphereLight" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#4F46E5" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </radialGradient>
    <rect 
      x="32" 
      y="32" 
      width="448" 
      height="448" 
      rx="104" 
      ry="104" 
      fill="url(#innerSphereLight)" 
    />

    <!-- Subtle Beveled Rim Stroke -->
    <rect 
      x="33" 
      y="33" 
      width="446" 
      height="446" 
      rx="103" 
      ry="103" 
      fill="none" 
      stroke="url(#rimStroke)" 
      stroke-width="3" 
      opacity="0.85" 
    />

    <!-- 3D Gloss Sheen Overlay (Top Dome Reflection) -->
    <path 
      d="M34 136 C34 78 80 34 138 34 L374 34 C432 34 478 78 478 136 C478 200 420 220 256 220 C92 220 34 200 34 136 Z" 
      fill="url(#glossHighlight)" 
    />

    <!-- Center Icon Mark (Geometric 'L' + Harmonic Soundwaves) -->
    <g id="linguist-mark" filter="url(#elementGlow)">

      <!-- Acoustic Soundwave Arcs (Pulsing Voice Frequencies) -->
      <!-- Wave 1 (Inner Arc) -->
      <path 
        d="M 285 240 A 65 65 0 0 1 285 360" 
        fill="none" 
        stroke="url(#soundwaveGrad1)" 
        stroke-width="14" 
        stroke-linecap="round" 
        filter="url(#soundwaveGlow)"
      />

      <!-- Wave 2 (Middle Arc) -->
      <path 
        d="M 330 205 A 115 115 0 0 1 330 395" 
        fill="none" 
        stroke="url(#soundwaveGrad2)" 
        stroke-width="14" 
        stroke-linecap="round" 
        filter="url(#soundwaveGlow)"
      />

      <!-- Wave 3 (Outer Arc) -->
      <path 
        d="M 375 170 A 165 165 0 0 1 375 430" 
        fill="none" 
        stroke="url(#soundwaveGrad3)" 
        stroke-width="14" 
        stroke-linecap="round" 
        filter="url(#soundwaveGlow)"
      />

      <!-- Harmonic Soundwave Amplitude Bars (Vertical Vocal Rhythm Nodes) -->
      <line x1="285" y1="285" x2="285" y2="315" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" opacity="0.9" />
      <line x1="330" y1="270" x2="330" y2="330" stroke="#818CF8" stroke-width="6" stroke-linecap="round" opacity="0.8" />
      <line x1="375" y1="260" x2="375" y2="340" stroke="#C084FC" stroke-width="6" stroke-linecap="round" opacity="0.7" />

      <!-- 3D Extruded Shadow Layer for Geometric Lettermark 'L' -->
      <path 
        d="M 134 146
           L 182 146
           L 182 334
           L 278 334
           L 278 382
           L 134 382
           Z" 
        fill="url(#lettermarkDepth)" 
        transform="translate(6, 8)"
      />

      <!-- Primary 3D Geometric Lettermark 'L' -->
      <path 
        d="M 134 140
           C 134 133 139 128 146 128
           L 174 128
           C 181 128 186 133 186 140
           L 186 324
           L 266 324
           C 273 324 278 329 278 336
           L 278 364
           C 278 371 273 376 266 376
           L 146 376
           C 139 376 134 371 134 364
           Z" 
        fill="url(#lettermarkGrad)" 
      />

      <!-- Top Edge Specular Chamfer on Lettermark 'L' -->
      <path 
        d="M 136 138
           L 172 138
           M 136 140
           L 136 362
           M 138 326
           L 264 326" 
        stroke="#FFFFFF" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-opacity="0.65" 
      />

      <!-- Radiant Acoustic Pulse Sphere (Core Voice Node at L intersection) -->
      <circle cx="160" cy="350" r="10" fill="#38BDF8" filter="url(#soundwaveGlow)" />
      <circle cx="160" cy="350" r="5" fill="#FFFFFF" opacity="0.9" />

    </g>

    <!-- Bottom Ambient Reflection Accent -->
    <ellipse cx="256" cy="460" rx="140" ry="12" fill="#818CF8" opacity="0.25" filter="url(#soundwaveGlow)" />

  </g>
</svg>
